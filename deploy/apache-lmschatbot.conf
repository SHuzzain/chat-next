# Apache: existing chatbot on / (3606) + lms-agent on /agent/ (3607)
# Public agent: https://lmschatbot.champslms.com/agent/
#
# Requires Next.js basePath: "/agent" and NEXT_PUBLIC_BASE_PATH=/agent
# LMS frontend: NEXT_PUBLIC_CHATBOT_URL=https://lmschatbot.champslms.com/agent

<VirtualHost *:80>
    ServerName lmschatbot.champslms.com
    ServerAdmin admin@openwavecomp.in

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    <Proxy *>
        Require all granted
    </Proxy>

    # New lms-agent — keep /agent on backend (matches Next basePath)
    ProxyPass        /agent/ http://127.0.0.1:3607/agent/
    ProxyPassReverse /agent/ http://127.0.0.1:3607/agent/

    # Existing chatbot (unchanged)
    ProxyPass        / http://127.0.0.1:3606/
    ProxyPassReverse / http://127.0.0.1:3606/

    ErrorLog  ${APACHE_LOG_DIR}/chatbot-lms-prod-error.log
    CustomLog ${APACHE_LOG_DIR}/chatbot-lms-prod-access.log combined
</VirtualHost>
